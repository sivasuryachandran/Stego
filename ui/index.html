<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stego</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232FA84F' stroke='%23111' stroke-width='2'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='700' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Toy-Brick Prehistoric Triage (from the Stitch DESIGN.md) */
:root{
  --canvas:#F6F3EA; --ink:#111; --white:#fff; --green:#2FA84F; --amber:#F5A524; --red:#E5484D; --grey:#E2DFD2; --yellow:#FFD83D;
  --green-d:#006e2b; --amber-d:#835400; --red-d:#b5242f; --mut:#5d5b54;
  --head:"Space Grotesk",system-ui,sans-serif; --body:Inter,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{background:var(--canvas)}
body{margin:0;color:var(--ink);font:14px/1.55 var(--body);background:var(--canvas);
  background-image:radial-gradient(rgba(17,17,17,.05) 1px,transparent 1px);background-size:16px 16px}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono)} .head{font-family:var(--head)}
.up{text-transform:uppercase;letter-spacing:.05em}
/* top bar */
header{position:sticky;top:0;z-index:10;background:var(--canvas);border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:20px;padding:10px 40px;flex-wrap:wrap}
.logo{font:700 24px var(--head);letter-spacing:-.02em}
.tag{font:500 11px var(--mono);border:2px solid var(--ink);border-radius:8px;padding:4px 10px;background:var(--grey);box-shadow:3px 3px 0 var(--ink)}
nav{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:nowrap;min-width:0}
nav button{background:none;border:2px solid transparent;border-radius:8px;padding:6px 11px;font:500 15px var(--head);color:var(--mut);white-space:nowrap}
nav button[aria-current=page]{background:var(--white);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink);color:var(--ink)}
.hstack{display:flex;flex-direction:column;align-items:stretch;gap:6px;flex:none}
.hstack .pill{justify-content:center;white-space:nowrap}
.hstack .btn.sm{padding:3px 10px;text-align:center;white-space:nowrap}
@media(max-width:1760px){.tag{display:none}}
@media(max-width:1340px){nav{order:3;flex:1 0 100%}header{row-gap:10px}}
@media(max-width:760px){nav{justify-content:flex-start;overflow-x:auto}}
.pill{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--mono);border:2px solid var(--ink);border-radius:8px;padding:5px 10px;background:var(--white);box-shadow:2px 2px 0 var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);border:1.5px solid var(--ink);display:inline-block}
/* buttons */
.btn{font:700 15px var(--head);border:2px solid var(--ink);border-radius:8px;padding:9px 18px;background:var(--white);box-shadow:3px 3px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.green{background:var(--green)} .btn.red{background:var(--red-d);color:#fff} .btn.dark{background:var(--ink);color:#fff} .btn.yellow{background:var(--yellow)}
.btn.sm{font:700 12px var(--mono);padding:5px 10px}
.btn.dashed{background:var(--grey);border-style:dashed}
/* sub bar */
.strip{background:var(--grey);border-bottom:2px solid var(--ink);padding:6px 40px;font:500 11px var(--mono);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;letter-spacing:.05em}
.strip .sticker{background:var(--yellow);border:2px solid var(--ink);border-radius:6px;padding:1px 8px;font-weight:700}
main{max-width:1600px;margin:0 auto;padding:28px 40px 60px}
.banner{border:2px solid var(--ink);border-radius:8px;padding:8px 14px;margin-bottom:20px;font:500 12px var(--mono);box-shadow:3px 3px 0 var(--ink)}
.banner.sample{background:var(--yellow)} .banner.real{background:#8dfa9a}
/* cards with studs */
.card{position:relative;background:var(--white);border:2px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--ink);padding:18px;margin-top:8px}
.card.studs::before{content:"";position:absolute;top:-8px;left:16px;width:calc(100% - 32px);max-width:92px;height:6px;
  background:radial-gradient(circle at 6px 6px,var(--white) 0 4px,transparent 4.5px);}
.stud{position:absolute;top:-8px;left:16px;display:flex;gap:16px}
.stud i{width:12px;height:8px;border:2px solid var(--ink);border-bottom:0;border-radius:6px 6px 0 0;background:inherit}
.card.g{background:#d9f3df} .card.a{background:#fde8c3} .card.r{background:#fbd0d1}
.card.u{background:var(--grey);border-style:dashed}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.02em}
h1{font-size:48px;line-height:1.1;font-weight:700} h2{font-size:28px;font-weight:700} h3{font-size:18px;font-weight:700}
.lab{font:700 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.metric{font:700 32px/1.1 var(--mono);letter-spacing:-.02em}
.badge{font:700 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border:2px solid var(--ink);border-radius:4px;background:var(--white);display:inline-block}
.badge.g{background:#8dfa9a} .badge.a{background:var(--amber)} .badge.r{background:var(--red);color:#fff} .badge.y{background:var(--yellow)}
.grid{display:grid;gap:24px} .g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:4fr 5fr 3fr}
.sec{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin:36px 0 16px}
.sec h2{font-size:22px}
/* hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;padding:20px 0}
.hero h1{font-size:64px;text-transform:uppercase;line-height:1}
.sticker{display:inline-block;background:var(--yellow);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:6px 14px;font:700 20px var(--head);transform:rotate(-2deg);text-transform:uppercase}
.rig{border:2px solid var(--ink);border-radius:8px;box-shadow:6px 6px 0 var(--ink);background:var(--white);overflow:hidden}
.rig .bar{display:flex;justify-content:space-between;background:var(--grey);border-bottom:2px solid var(--ink);padding:6px 12px;font:500 11px var(--mono)}
.rig svg{display:block;width:100%;background-image:linear-gradient(rgba(17,17,17,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(17,17,17,.06) 1px,transparent 1px);background-size:24px 24px}
/* workspace */
.page{background:var(--white);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:26px 32px;font:14px/1.75 var(--body);position:relative}
.page .hd{display:flex;justify-content:space-between;font:500 11px var(--mono);color:var(--mut);border-bottom:1px solid #ccc;padding-bottom:8px;margin-bottom:14px}
.hl{background:var(--yellow);border:2px solid var(--ink);border-radius:8px;padding:12px 14px;margin:14px 0;position:relative;box-shadow:3px 3px 0 var(--ink)}
.hl .flag{position:absolute;top:-12px;right:12px;background:var(--red-d);color:#fff;font:700 10px var(--mono);padding:2px 8px;border-radius:4px;border:2px solid var(--ink);transform:rotate(1.5deg)}
.faded{color:#a9a69b}
.seg{display:flex;gap:3px;border:2px solid var(--ink);border-radius:4px;padding:3px;background:var(--white)}
.seg i{flex:1;height:10px;background:var(--grey)}
.q{display:block;width:100%;text-align:left;border:2px solid var(--ink);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--white);box-shadow:3px 3px 0 var(--ink)}
.q.sel{outline:3px solid var(--yellow);outline-offset:1px}
.q.r{background:var(--red);} .q.a{background:var(--white)} .q.u{background:var(--grey);border-style:dashed}
.q .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font:700 15px var(--head)}
.q .m{display:flex;justify-content:space-between;font:500 11px var(--mono);margin-top:6px}
.meter{height:8px;border:2px solid var(--ink);background:var(--white);margin-top:6px;border-radius:2px;overflow:hidden}.meter i{display:block;height:100%;background:var(--green)}
.q.a .meter i{background:var(--amber)} .q.r .meter i{background:var(--ink)} .q.u .meter i{background:#777}
.qh{font:700 11px var(--mono);letter-spacing:.05em;margin:16px 0 8px;text-transform:uppercase;display:flex;justify-content:space-between}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini .q{margin:0;padding:8px 10px}.mini .q .row{font-size:13px}
/* tables */
table{width:100%;border-collapse:collapse}
th{font:700 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;text-align:right;padding:10px;background:var(--grey);border-bottom:2px solid var(--ink)}
td{font:500 13px var(--mono);text-align:right;padding:12px 10px;border-bottom:2px solid var(--ink)}
th:first-child,td:first-child,.l{text-align:left}
.tw{border:2px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--ink);overflow:auto;background:var(--white)}
tr.winner td{background:#fde8c3} tr.bb td{background:#d9f3df}
td.best{color:var(--green-d);font-weight:700}
/* portfolio */
.chip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:8px;padding:5px 12px;background:var(--canvas);font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.04em}
.chip[aria-pressed=true]{background:var(--amber);box-shadow:2px 2px 0 var(--ink)}
.fp{display:inline-flex;gap:5px;border:2px solid var(--ink);border-radius:999px;padding:5px 9px;background:var(--canvas)}
.fp i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink)}
.fp i.g{background:var(--green)}.fp i.a{background:var(--amber)}.fp i.r{background:var(--red)}.fp i.u{background:var(--grey);border-style:dashed}
.row-c{display:grid;grid-template-columns:3fr 1.2fr 3.4fr 1fr;gap:12px;align-items:center;border:2px solid var(--ink);border-radius:8px;background:var(--white);box-shadow:3px 3px 0 var(--ink);padding:14px 16px;margin-bottom:14px}
.found{background:#fde0b3;border:2px solid var(--ink);border-radius:8px;padding:10px 14px;box-shadow:3px 3px 0 var(--ink);font:500 15px var(--head);margin-top:14px}
/* brief */
.sheet{background:var(--canvas);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:32px 36px;position:relative;margin-top:14px}
.band{display:flex;justify-content:space-between;align-items:center;color:#fff;font:700 20px var(--head);padding:8px 16px;text-transform:uppercase}
.band.r{background:var(--red-d)}.band.a{background:var(--amber-d)}.band.g{background:var(--green-d)}
.bsec{border:2px solid var(--ink);border-top:0;background:var(--white);padding:12px;margin-bottom:22px;box-shadow:3px 3px 0 var(--ink)}
.bi{display:flex;justify-content:space-between;gap:16px;padding:10px 12px;margin-bottom:8px;border-radius:6px}
.bi.r{background:#fcefef}.bi.a{background:#fdf5e6}
.ag{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ag div{background:#eeece6;padding:6px 10px;display:flex;justify-content:space-between;font-weight:500}
select{font:500 14px var(--body);border:2px solid var(--ink);border-radius:8px;padding:8px 12px;background:var(--white);box-shadow:3px 3px 0 var(--ink)}
footer{border-top:2px solid var(--ink);padding:18px 40px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:500 11px var(--mono);text-transform:uppercase}
svg text{font:500 10px var(--mono);fill:var(--ink)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--yellow);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:10px 18px;font:700 13px var(--mono);z-index:30;border-radius:8px}
@media(max-width:1100px){.g4{grid-template-columns:1fr 1fr}.g3,.g2,.hero{grid-template-columns:1fr}.hero h1{font-size:44px}.row-c{grid-template-columns:1fr}main,header,.strip,footer{padding-left:20px;padding-right:20px}.ag{grid-template-columns:1fr 1fr}}

#printdoc{display:none}
@page{size:A4;margin:16mm 14mm 18mm;
  @bottom-left{content:"Stego · contract triage without the big brain · clause triage, not legal advice";font:8pt Inter,sans-serif;color:#555}
  @bottom-right{content:"Page " counter(page) " of " counter(pages);font:8pt Inter,sans-serif;color:#555}}
@media print{
  header,.strip,footer,.noprint,.banner,.toolbar,.sheet,#fossil,.toast{display:none!important}
  html,body{background:#fff!important}body{background-image:none!important;font-size:10.5pt;line-height:1.45}
  main{padding:0!important;max-width:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printdoc{display:block;color:#111}
  .pd-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:3px solid #111;padding-bottom:10px;margin-bottom:14px}
  .pd-brand{display:flex;align-items:center;gap:12px}.pd-logo{width:92px;height:auto}
  .pd-word{font:700 30pt/1 var(--head);letter-spacing:-.02em}.pd-tag{font:500 8.5pt var(--mono);color:#555;text-transform:uppercase;letter-spacing:.04em;margin-top:3px}
  .pd-title{text-align:right}.pd-title b{display:block;font:700 17pt/1.1 var(--head);text-transform:uppercase}.pd-title span{font:500 9pt var(--mono);color:#555}
  .pd-meta{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;border:2px solid #111;padding:8px 12px;margin-bottom:12px;font:500 9pt var(--mono)}
  .pd-meta div{display:flex;gap:8px;padding:2px 0;border-bottom:1px dotted #bbb}.pd-meta b{width:92px;color:#555;text-transform:uppercase;font-size:7.5pt;letter-spacing:.04em;padding-top:1px}
  .pd-warn{border:2px solid #111;background:#FFD83D;padding:6px 10px;margin-bottom:12px;font:700 9pt var(--mono)}
  .pd-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
  .pd-sum div{border:2px solid #111;border-left-width:9px;padding:6px 10px}.pd-sum b{display:block;font:700 20pt/1.1 var(--mono)}.pd-sum span{font:700 7.5pt var(--mono);text-transform:uppercase;letter-spacing:.05em;color:#555}
  .pd-sum .r{border-left-color:#E5484D}.pd-sum .a{border-left-color:#F5A524}.pd-sum .g{border-left-color:#2FA84F}.pd-sum .u{border-left-color:#999}
  .pd-read{border:2px solid #111;padding:6px 10px;margin-bottom:14px;font-weight:600}
  .pd-h{font:700 13pt var(--head);text-transform:uppercase;background:#111;color:#fff;padding:5px 10px;margin:16px 0 8px;break-after:avoid}
  table.pd-t{width:100%;border-collapse:collapse;font-size:9.5pt}
  .pd-t thead{display:table-header-group}.pd-t tr{break-inside:avoid}
  .pd-t th{background:#E2DFD2;border:1.5px solid #111;padding:4px 7px;text-align:left;font:700 7.5pt var(--mono);text-transform:uppercase;letter-spacing:.04em}
  .pd-t td{border:1px solid #111;padding:4px 7px;text-align:left;font:500 9.5pt var(--body);vertical-align:top}
  .pd-t td.m{font:700 9pt var(--mono);white-space:nowrap}
  .pd-q{display:inline-block;border:1.5px solid #111;border-radius:3px;padding:0 6px;font:700 7.5pt var(--mono);text-transform:uppercase}
  .pd-q.r{background:#E5484D;color:#fff}.pd-q.a{background:#F5A524}.pd-q.u{background:#E2DFD2}
  .pd-pg{display:inline-block;background:#111;color:#fff;font:700 9pt var(--mono);padding:1px 8px;border-radius:3px}
  .pd-page{break-inside:avoid-page;margin:10px 0}
  .pd-ph{display:flex;align-items:center;gap:10px;border-bottom:2px solid #111;padding-bottom:3px;margin-bottom:6px;break-after:avoid}.pd-ph b{font:700 12pt var(--head)}
  .pd-it{break-inside:avoid;border:1.5px solid #111;border-left-width:9px;padding:6px 10px;margin:6px 0}
  .pd-it.r{border-left-color:#E5484D}.pd-it.a{border-left-color:#F5A524}.pd-it.u{border-left-color:#999;border-style:dashed;border-left-style:solid}
  .pd-it .top{display:flex;justify-content:space-between;gap:10px;align-items:center}.pd-it .top b{font:700 11pt var(--head)}
  .pd-it .top .pp{font:700 10pt var(--mono)}
  .pd-it blockquote{margin:4px 0 0;padding:3px 8px;border-left:3px solid #FFD83D;background:#fffbe6;font-size:9.5pt}
  .pd-clr{columns:3;font-size:9.5pt}.pd-clr div{break-inside:avoid;padding:1px 0}
  .pd-note{margin-top:14px;font:500 8pt var(--mono);color:#555;border-top:1px solid #111;padding-top:6px}
}

.brand{display:flex;align-items:center;gap:10px}.logomark{width:56px;height:38px}
.drop{border:3px dashed var(--ink);border-radius:8px;background:var(--grey);padding:28px;text-align:center;font:700 18px var(--head);margin-top:14px}
.drop.over{background:var(--yellow)}
.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.step{position:relative}.step .n{font:700 11px var(--mono);background:var(--ink);color:#fff;display:inline-block;padding:1px 8px;border-radius:4px;margin-bottom:8px}
.step.drex{background:#dbe8ff}
.step p{margin:6px 0 0;font-size:13px;color:#333}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.no li,.yes li{margin:6px 0}
.ov{position:fixed;inset:0;background:rgba(246,243,234,.9);z-index:40;display:flex;align-items:center;justify-content:center}
.ov .card{text-align:center;min-width:320px}
.spin{width:36px;height:36px;border:4px solid var(--ink);border-top-color:var(--yellow);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 12px}@keyframes sp{to{transform:rotate(360deg)}}
iframe.pdf{width:100%;height:560px;border:2px solid var(--ink);background:#fff;box-shadow:5px 5px 0 var(--ink)}
.modebar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media(max-width:1100px){.flow,.cols3{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.flow,.cols3{grid-template-columns:1fr}}

.bf{display:grid;grid-template-columns:1fr 1.1fr;gap:40px;align-items:center;margin:36px 0}
.bf.flip .bf-t{order:2}.bf.flip .bf-i{order:1}
.bf-t .kicker{display:inline-block;font:700 11px var(--mono);letter-spacing:.06em;background:var(--ink);color:#fff;padding:3px 10px;border-radius:4px;text-transform:uppercase}
.bf-t h3{font-size:34px;line-height:1.1;margin:12px 0 8px;font-family:var(--head)}
.bf-t p{margin:0 0 14px;color:var(--mut);font-weight:500;font-size:16px}
.bf-t ul{list-style:none;padding:0;margin:0}
.bf-t li{position:relative;padding:8px 0 8px 30px;border-top:2px solid var(--ink);font-weight:500}
.bf-t li::before{content:"";position:absolute;left:0;top:11px;width:16px;height:16px;border:2px solid var(--ink);border-radius:4px;background:var(--green)}
.bf-i{border:2px solid var(--ink);border-radius:8px;box-shadow:6px 6px 0 var(--ink);background:var(--white);overflow:hidden}
.bf-i .bar{display:flex;justify-content:space-between;background:var(--grey);border-bottom:2px solid var(--ink);padding:6px 12px;font:500 11px var(--mono)}
.bf-i svg{display:block;width:100%;background-color:#fbf9f2;background-image:linear-gradient(rgba(17,17,17,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(17,17,17,.06) 1px,transparent 1px);background-size:22px 22px}
.bf-i svg text{font:700 11px var(--mono);fill:#111}
@keyframes slide{0%{transform:translateX(-14px);opacity:.2}30%,70%{transform:none;opacity:1}100%{transform:translateX(14px);opacity:.2}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.an1{animation:slide 4.5s ease-in-out infinite}.an2{animation:bob 3s ease-in-out infinite}.an3{animation:bob 3s .5s ease-in-out infinite}.an4{animation:bob 3s 1s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.an1,.an2,.an3,.an4{animation:none}}
@media(max-width:900px){.bf{grid-template-columns:1fr}.bf.flip .bf-t,.bf.flip .bf-i{order:initial}}

.scene{display:block;width:100%;background:#eef0e3}
.scene .lyr{opacity:0;transition:opacity .5s}
.s-ingest .l-ingest,.s-decide .l-decide,.s-abstain .l-abstain,.s-prove .l-prove{opacity:1}
.scene text{font:700 11px var(--mono);fill:#111}
@keyframes fp{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(106px,61px)}}
@keyframes tok{0%{opacity:0;transform:translate(0,0)}10%{opacity:1}70%{opacity:1;transform:translate(var(--dx),var(--dy))}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.22}}

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = v => v == null ? "–" : (v * 100).toFixed(1) + "%";
const sec = ms => ms == null ? "–" : ms < 1000 ? Math.round(ms) + " ms" : (ms / 1000).toFixed(1) + " s";
const usd = v => v == null ? "–" : "$" + v.toFixed(3);
const studs = n => `<div class="stud">${"<i></i>".repeat(n)}</div>`;

const ROOT = location.pathname.startsWith("/ui/") && location.port !== "8000" ? "../" : (location.pathname.startsWith("/ui/") ? "../" : "/");
let D;
const state = { tab: "landing", ci: 0, sel: null, filter: new Set(), decisions: {} };
// Urgent = a policy layer over the Drex output, NOT ground truth (CUAD labels presence, not risk).
const URGENT = new Set(["Uncapped Liability", "Change Of Control", "Liquidated Damages", "Non-Compete"]);

/* ---------- data: real runs first, sample as fallback ---------- */
async function tryJSON(u) { try { const r = await fetch(u); return r.ok ? await r.json() : null; } catch { return null; } }
async function tryJSONL(u) { try { const r = await fetch(u); if (!r.ok) return null; return (await r.text()).split("\n").filter(Boolean).map(l => JSON.parse(l)); } catch { return null; } }
async function load() {
  let base = await loadBench();
  if (base.sample) base = { ...base, summary: base.summary.map(x => ({ arm: x.arm })), ledger: [] };  // never show invented numbers
  const st = await tryJSON("/api/state");
  if (st) { base.server = st; base.liveLedger = st.ledger; base.live = st.contracts; base.decisions = st.decisions || {};
    const seenT = new Set(); base.live = st.contracts.filter(c => !seenT.has(c.title) && seenT.add(c.title));   // newest upload per file name
    base.contracts = [...base.live, ...base.contracts]; base.categories = base.categories || st.categories;
    if (base.sample) { base.theta = st.theta; base.tau = st.tau; } }
  return base;
}
async function loadBench() {
  const dir = new URLSearchParams(location.search).get("run");
  for (const d of dir ? [dir] : ["runs/final", "runs/latest", "runs/gate"]) {
    const res = await tryJSON(`${ROOT}${d}/results.json`); if (!res) continue;
    const preds = (await tryJSONL(`${ROOT}${d}/predictions.jsonl`)) || [], ledger = (await tryJSONL(`${ROOT}${d}/ledger.jsonl`)) || [];
    const contracts = preds.filter(p => p.arm === "drex" && p.out).map(p => ({
      title: p.contract, ms: p.ms, pages: null,
      clauses: Object.fromEntries(Object.entries(p.out).map(([c, o]) => [c, { p: o.p, evidence: (o.evidence || []).slice(0, 3).map(i => ({ chunk: i })) }]))
    }));
    return { ...res, sample: false, run: d, contracts, ledger };
  }
  return window.STEGO_SAMPLE;
}

/* ---------- plain-code routing ---------- */
const conf = p => p >= D.theta ? p : 1 - p;
function queue(c, p) { // returns r / a / u / g
  if (conf(p) < D.tau) return "u";
  if (p < D.theta) return "g";
  return URGENT.has(c) ? "r" : "a";
}
const kind = r => r.kind || (/drex/.test(r.model || "") ? "drex" : "llm");

function upload(file, parent) {
  const job = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const xhr = new XMLHttpRequest(); let poll = null, finished = false;
  const ui = dinoOverlay(file.name, () => cancel());
  const finish = () => { finished = true; clearInterval(poll); ui.close(); };
  const cancel = () => { if (finished) return; xhr.abort(); fetch("/api/cancel/" + job, { method: "POST" }).catch(() => {}); finish(); toast("Dig cancelled."); };
  xhr.open("POST", "/api/analyze");
  xhr.setRequestHeader("X-Filename", encodeURIComponent(file.name)); xhr.setRequestHeader("X-Job", job); if (parent) xhr.setRequestHeader("X-Parent", parent);
  xhr.upload.onprogress = e => { if (e.lengthComputable) ui.set(e.loaded / e.total * 10, `Uploading ${(e.loaded / 1e6).toFixed(1)} of ${(e.total / 1e6).toFixed(1)} MB`); };
  xhr.upload.onload = () => { ui.set(10, "Upload done. Drex takes over…");
    poll = setInterval(async () => { try { const p = await (await fetch("/api/progress/" + job)).json(); if (p && p.pct != null) ui.set(p.pct, p.detail); } catch (e) { /* keep polling */ } }, 350); };
  xhr.onload = async () => {
    if (finished) return; let j = {}; try { j = JSON.parse(xhr.responseText); } catch (e) { j = { error: "unreadable response" }; }
    if (xhr.status !== 200) { finish(); toast("The dig failed: " + (j.error || xhr.status)); return; }
    ui.set(100, "Fossil unearthed"); await new Promise(r => setTimeout(r, 350));
    D = await load(); state.ci = Math.max(0, D.contracts.findIndex(c => c.id === j.id)); state.sel = null;
    await ui.done({ pages: j.pages, decisions: j.drex_decisions, ms: j.ms });
    finish(); go("workspace");
  };
  xhr.onerror = () => { if (!finished) { finish(); toast("The dig failed: network error"); } };
  xhr.send(file);
}

/* ---------- isometric brick scene (one looping illustration) ---------- */
const U = 34, OX = 300, OY = 96;
const pt = (x, y, z = 0) => [OX + (x - y) * .866 * U, OY + (x + y) * .5 * U - z * U];
const f1 = v => v.toFixed(1);
const poly = (pts, fill, extra = "") => `<polygon points="${pts.map(q => q.map(f1).join(",")).join(" ")}" fill="${fill}" stroke="#111" stroke-width="2.5" stroke-linejoin="round" ${extra}/>`;
const PAL = { W: ["#fff", "#ecebe4", "#d2d0c4"], G: ["#5fdc7e", "#2FA84F", "#1f7a38"], A: ["#ffc968", "#F5A524", "#c2810e"], Y: ["#ffe36b", "#FFD83D", "#d2ae10"], R: ["#f27579", "#E5484D", "#b5242f"], K: ["#555", "#2b2b2b", "#111"], N: ["#efece0", "#E2DFD2", "#c9c5b3"] };
function cube(x, y, w, d, h, c, z0 = 0, dash = "") {
  const P = PAL[c], T = [pt(x, y, z0 + h), pt(x + w, y, z0 + h), pt(x + w, y + d, z0 + h), pt(x, y + d, z0 + h)];
  const L = [pt(x, y + d, z0 + h), pt(x + w, y + d, z0 + h), pt(x + w, y + d, z0), pt(x, y + d, z0)];
  const R = [pt(x + w, y, z0 + h), pt(x + w, y + d, z0 + h), pt(x + w, y + d, z0), pt(x + w, y, z0)];
  const ex = dash ? `stroke-dasharray="${dash}"` : "";
  let studs = "";
  if (w >= 1 && h >= .25 || w >= 1) for (let i = 0; i < Math.floor(w); i++) for (let j = 0; j < Math.floor(d); j++) {
    const [cx, cy] = pt(x + (i + .5) * w / Math.floor(w), y + (j + .5) * d / Math.floor(d), z0 + h);
    studs += `<ellipse cx="${f1(cx)}" cy="${f1(cy + 4)}" rx="9" ry="5" fill="${P[2]}" stroke="#111" stroke-width="2"/><ellipse cx="${f1(cx)}" cy="${f1(cy)}" rx="9" ry="5" fill="${P[0]}" stroke="#111" stroke-width="2"/>`;
  }
  return poly(L, P[1], ex) + poly(R, P[2], ex) + poly(T, P[0], ex) + studs;
}
function flat(x, y, w, d, fill = "#fff") {
  const Q = [pt(x, y, .03), pt(x + w, y, .03), pt(x + w, y + d, .03), pt(x, y + d, .03)];
  let l = ""; for (let k = 1; k <= 3; k++) { const a = pt(x + .12 * w, y + d * k / 4, .03), b = pt(x + .88 * w, y + d * k / 4, .03); l += `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="#bdb9a8" stroke-width="2"/>`; }
  return poly(Q, fill) + l;
}
const wall = (x0, y0, x1, y1, z0, z1, fill, extra = "") => poly([pt(x0, y0, z0), pt(x1, y1, z0), pt(x1, y1, z1), pt(x0, y0, z1)], fill, extra);
const tag = (x, y, t, fill = "#fff", w = 74) => `<g><rect x="${x + 3}" y="${y + 3}" width="${w}" height="22" fill="#111"/><rect x="${x}" y="${y}" width="${w}" height="22" fill="${fill}" stroke="#111" stroke-width="2.5"/><text x="${x + w / 2}" y="${y + 15}" text-anchor="middle">${t}</text></g>`;


function floorSVG() {
  let f = poly([pt(0, 0), pt(10, 0), pt(10, 10), pt(0, 10)].map(q => [q[0], q[1] + 7]), "#111") + poly([pt(0, 0), pt(10, 0), pt(10, 10), pt(0, 10)], "#f4f2e6");
  for (let i = 1; i < 10; i++) { const a = pt(i, 0), b = pt(i, 10), c = pt(0, i), d = pt(10, i);
    f += `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="rgba(17,17,17,.13)"/><line x1="${f1(c[0])}" y1="${f1(c[1])}" x2="${f1(d[0])}" y2="${f1(d[1])}" stroke="rgba(17,17,17,.13)"/>`; }
  return f;
}
const lbl = (x, y, z, dx, dy, t, fill, w) => tag(...pt(x, y, z).map((v, i) => v + (i ? dy : dx)), t, fill, w);
const SC = {
  // 1 INGEST: pages pass a scanner arch and come out as page bricks
  ingest() {
    const pages = [0, 1.4, 2.8].map(d => `<g class="pgfly" style="animation-delay:${d}s">${flat(0, 4.6, 1.1, .85)}</g>`).join("");
    const beam = `<g class="pulse">${wall(4.5, 3.7, 4.5, 6.3, .1, 2.5, "rgba(255,216,61,.6)", 'stroke="none"')}</g>`;
    const outs = [[2.4, "Y", "p.1"], [4.0, "A", "p.2"], [5.6, "G", "p.3"]].map(([y, c, t], i) =>
      `<g class="dropb" style="animation-delay:${1 + i * 1.1}s">${cube(6.4, y, 1.4, 1.2, .6, c)}${lbl(7.8, y + 1.2, 0, 4, 4, t, "#fff", 44)}</g>`).join("");
    return cube(4.2, 3.4, .6, .6, 2.6, "K") + pages + beam + cube(4.2, 6.0, .6, .6, 2.6, "K") + cube(4.2, 3.4, .6, 3.2, .4, "K", 2.6) + outs + lbl(1.2, 3.2, 0, 0, -8, "PDF pages", "#fff", 86) + lbl(5, 2.0, 3.4, -50, -6, "scan → spans with page + box", "#FFD83D", 196);
  },
  // 2 DECIDE: Drex core fires a wave across a 4x5 answer grid
  decide() {
    const dots = []; for (let r = 0; r < 5; r++) for (let c = 0; c < 4; c++) dots.push([r, c]);
    dots.sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]));
    const grid = dots.map(([r, c]) => { const i = r * 4 + c, col = ["G", "A", "R", "N"][(i * 7 + (i >> 2)) % 4];
      return `<g class="popb" style="animation-delay:${((r + c) * .22).toFixed(2)}s">${cube(5.3 + c * 1.05, 2.3 + r * 1.05, .8, .8, .35, col)}</g>`; }).join("");
    const a = pt(4.1, 5, 1), b = pt(5.4, 4.6, .5);

      `<g class="bobb">${lbl(3.35, 4.95, 1.5, -30, -62, "DREX", "#2FA84F", 60)}</g>` + lbl(8.5, 2.3, 1.1, -24, -30, "p=0.xx", "#FFD83D", 66) + lbl(1.2, 6.3, 0, -10, 6, "20 questions · 1 request", "#fff", 176);
  },
  // 3 ABSTAIN: belt → τ gate → three lanes
  abstain() {
    const lanes = [[1.5, "G", "AUTO-CLEARED", ""], [4.4, "A", "FOUND", ""], [7.3, "N", "HUMAN", "7 5"]];
    const sx = [.3, 4.7, .2], toks = lanes.map(([y, c], i) => {
      const s0 = pt(.3, 4.7, .2), g = pt(4.85, 4.7, .2), e = pt(7.9, y + .25, .9);
      return `<g class="tok2" style="--ax:${f1(g[0] - s0[0])}px;--ay:${f1(g[1] - s0[1])}px;--bx:${f1(e[0] - s0[0])}px;--by:${f1(e[1] - s0[1])}px;animation-delay:${i * 1.6}s">${cube(.3, 4.7, .5, .5, .5, c, .2, c === "N" ? "4 3" : "")}</g>`; }).join("");
    const lane = lanes.map(([y, c, t, d]) => cube(5.3, y, 2.2, 1, .18, "N") + cube(7.6, y, 1.4, 1, .8, c, 0, d) + lbl(9, y + 1, 0, -4, 6, t, "#fff", t.length * 8 + 16)).join("");
    return cube(0, 4.4, 4.5, 1.2, .18, "N") + cube(4.6, 3.9, .5, .5, 2, "K") + lane + cube(4.6, 5.9, .5, .5, 2, "K") + cube(4.6, 3.9, .5, 2.5, .35, "K", 2) + toks +
      lbl(4.85, 5.1, 2.4, -56, -34, "confidence ≥ τ ?", "#fff", 112);
  },
  // 4 PROVE: receipts stack into a ledger, a lens inspects the top
  prove() {
    const slabs = [0, 1, 2, 3, 4, 5].map(i => { const z = i * .34, a = pt(3.9, 4.8, z + .28), b = pt(6.1, 4.8, z + .28);
      return `<g class="dropb" style="animation-delay:${(i * .7).toFixed(1)}s;animation-duration:6s">${cube(3.6, 3.8, 3, 2, .28, i === 4 ? "A" : i % 2 ? "G" : "W", z)}<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="#111" stroke-width="2.5"/></g>`; }).join("");
    const card = (() => { const q = [pt(7.2, 3.2, .03), pt(9.4, 3.2, .03), pt(9.4, 4.9, .03), pt(7.2, 4.9, .03)];
      const ln = [[.3, "#FFD83D", .9], [.5, "#8DFA9A", .7], [.7, "#fff", .8]].map(([k, c, w]) => { const a = pt(7.4, 3.2 + 1.7 * k, .03), b = pt(7.4 + 1.8 * w, 3.2 + 1.7 * k, .03); return `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="${c}" stroke-width="3"/>`; }).join("");
      return poly(q, "#2b2b2b") + ln; })();
    const [mx, my] = pt(5.1, 4.8, 2.7);

  },
};

      <div class="lgrid">${(((state.lf || "all") === "all") ? [...q.r, ...q.a, ...q.u, ...q.g] : q[state.lf]).map(c => { const x = ct.clauses[c], k = queue(c, x.p);
        return `<button class="lt ${k} ${c === state.sel ? "sel" : ""}" data-c="${esc(c)}"><span class="lt-n">${esc(c)}</span><span class="lt-p">${loc(x).replace("Page ", "p.").replace("Chunk ", "c.")}</span><span class="lt-m"><i style="width:${x.p * 100}%"></i></span><span class="lt-v">${x.p.toFixed(2)}</span></button>`; }).join("") || '<div class="lab">None in this queue</div>'}</div>
      <div class="lab" style="margin-top:8px">Red = urgent (policy flag) · amber = found, confirm it · dashed grey = below τ, goes to a human · green = auto-cleared</div></div>
    </div></div>`;
  renderPdf();
  $("#csel").onchange = e => { state.ci = +e.target.value; state.sel = null; workspace(); };
  const v2 = $("#v2file"); if (v2) v2.onchange = e => { const f = e.target.files[0]; if (f) upload(f, ct.id); e.target.value = ""; };
  $("#view").onclick = e => {
    const c = e.target.closest("[data-c]"), d = e.target.closest("[data-d]"), n = e.target.closest("[data-nav]"), t = e.target.closest("[data-lf]");
    if (t) { state.lf = t.dataset.lf; workspace(); }
    else if (c) { state.sel = c.dataset.c; workspace(); }
    else if (d) { recordDecision(ct, state.sel, d.dataset.d); }
    else if (n) { const i = flagged.indexOf(state.sel); state.sel = flagged[(i + +n.dataset.nav + flagged.length) % flagged.length] || state.sel; workspace(); }
  };
}

/* ---------- portfolio ---------- */
function portfolio() {
  const f = state.filter, cats = D.categories;
  const hits = D.contracts.map((c, i) => [c, i]).filter(([c]) => [...f].every(k => c.clauses[k].p >= D.theta));
  const nRev = c => cats.filter(k => ["r", "a"].includes(queue(k, c.clauses[k].p))).length;
  const nHum = c => cats.filter(k => queue(k, c.clauses[k].p) === "u").length;
  hits.sort((a, b) => nHum(b[0]) + nRev(b[0]) - nHum(a[0]) - nRev(a[0]));
  const PER = 5, pages = Math.max(1, Math.ceil(hits.length / PER)); state.page = Math.min(state.page || 1, pages);
  const shown = hits.slice((state.page - 1) * PER, state.page * PER);
  $("#view").innerHTML = `
  <div class="card studs" style="background:#f0edec">${studs(5)}
    <span class="badge">Portfolio engine // ${D.contracts.length} contracts</span>
    <h1 style="margin:12px 0 4px;font-size:44px">Portfolio clause search</h1>
    <div class="grid g4" style="margin:16px 0">${(() => { const n = D.contracts.length, tot = n * cats.length, unc = D.contracts.reduce((a, c) => a + nHum(c), 0);
      return [["Contracts", n], ["Clauses triaged", tot.toLocaleString()], ["Uploaded live", (D.live || []).length], ["Sent to human", tot ? (unc / tot * 100).toFixed(1) + "%" : "–"]].map(([l, v]) => `<div class="card" style="margin:0;padding:10px 14px"><div class="lab">${l}</div><div class="metric" style="font-size:26px">${v}</div></div>`).join(""); })()}</div>
    <p style="margin:0 0 20px;color:var(--mut);font-weight:500">Pick clauses. Shows contracts where every picked clause is present or under review (${D.sample ? "sample contracts" : "your uploads plus the 82 benchmark report contracts"}).</p>
    <div class="card" style="margin:0"><div class="lab" style="margin-bottom:10px">Filter by (AND)</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">${cats.map(c => `<button class="chip" aria-pressed="${f.has(c)}" data-c="${esc(c)}">${esc(c)}${f.has(c) ? " ✕" : ""}</button>`).join("")}</div></div>
    <div class="found" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><span>Found <b style="text-decoration:underline">${hits.length}</b> matching contract${hits.length === 1 ? "" : "s"}${f.size ? " with " + [...f].map(esc).join(" AND ") : ""}.</span><button class="btn sm" id="csv">Export CSV</button></div></div>
  <div class="rbar"><div class="rbar-l"><span class="badge">${hits.length} contract${hits.length === 1 ? "" : "s"}</span><span class="lab">Sorted by: <b style="color:var(--ink)">clauses needing attention</b></span></div>
    <div class="legend" title="Each dot is one clause, always in the same order">${[["g", "Auto-cleared"], ["a", "Found · confirm"], ["r", "Urgent (policy)"], ["u", "Uncertain / human"]].map(([k, t]) => `<span class="lg"><i class="${k}"></i>${t}</span>`).join("")}</div></div>
  <div class="row-h"><span>Contract</span><span>Queue summary</span><span>${cats.length}-clause fingerprint</span><span>Open</span></div>
  ${shown.map(([c, i]) => { const worst = cats.some(k => queue(k, c.clauses[k].p) === "r");
    return `<div class="row-c"><div><b class="head" style="font-size:18px">${esc(c.title)}</b><div class="lab">${c.pages ? c.pages + " pages · " : ""}${sec(c.ms)}</div></div>
      <div><span class="badge ${worst ? "r" : nRev(c) ? "a" : "g"}">${nRev(c)} found · ${nHum(c)} human</span></div>
      <div><span class="fp" title="Fixed order of the ${cats.length} categories">${cats.map(k => `<i class="${queue(k, c.clauses[k].p)}" title="${esc(k)} p=${c.clauses[k].p.toFixed(2)}"></i>`).join("")}</span></div>
      <div style="text-align:right"><button class="btn sm" data-v="${i}">View →</button></div></div>`; }).join("") || '<div class="card">No matches.</div>'}
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:var(--grey)"><span class="lab">Display: ${hits.length ? (state.page - 1) * PER + 1 : 0} – ${Math.min(state.page * PER, hits.length)} of ${hits.length} [page ${state.page} / ${pages}]</span>
    <div style="display:flex;gap:6px"><button class="btn sm" data-pg="${state.page - 1}" ${state.page <= 1 ? "disabled" : ""}>PREV</button>${Array.from({ length: pages }, (_, i) => `<button class="btn sm ${i + 1 === state.page ? "dark" : ""}" data-pg="${i + 1}">${i + 1}</button>`).join("")}<button class="btn sm" data-pg="${state.page + 1}" ${state.page >= pages ? "disabled" : ""}>NEXT</button></div></div>
  <div class="lab" style="margin-top:14px">Each dot is one clause, always in config.CATEGORIES order. Hover a dot for the clause name and its probability.</div>`;
  $("#view").onclick = e => {
    const c = e.target.closest(".chip"), v = e.target.closest("[data-v]"), pg = e.target.closest("[data-pg]");
    if (e.target.id === "csv") { const q = x => '"' + String(x).split('"').join('""') + '"';
      const rows = [["contract", "pages", ...cats]].concat(hits.map(([ct]) => [ct.title, ct.pages ?? "", ...cats.map(k => ct.clauses[k].p.toFixed(3))]));
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([rows.map(r => r.map(q).join(",")).join("\n")], { type: "text/csv" })); a.download = "stego-portfolio.csv"; a.click(); }
    else if (pg && !pg.disabled) { state.page = +pg.dataset.pg; portfolio(); }
    else if (c) { f.has(c.dataset.c) ? f.delete(c.dataset.c) : f.add(c.dataset.c); state.page = 1; portfolio(); }
    else if (v) { state.ci = +v.dataset.v; state.sel = [...f][0] || null; go("workspace"); }
  };
}

/* ---------- benchmark ---------- */
function bench() {
  const S = D.summary, B = armB(), claim = B["acc_when_conf>=0.93"];
  const rows = [["Macro-F1","macro_f1",v=>v?.toFixed(3),1],["Accuracy (most clauses are absent, so this is flattered)","accuracy",pct,1],["Micro-F1","micro_f1",v=>v?.toFixed(3),1],["Evidence hit@1","evidence_hit@1",pct,1],["Evidence hit@3","evidence_hit@3",pct,1],
    ["Brier","brier",v=>v?.toFixed(3),-1],["ECE","ece",v=>v?.toFixed(3),-1],["Latency p50","latency_p50_ms",sec,-1],["Latency p95","latency_p95_ms",sec,-1],
    ["Cost / contract","cost_per_contract_usd",usd,-1],["Reasoning-LLM calls","llm_calls",v=>v??"–",-1],["Drex decisions / contract","drex_decisions_per_contract",v=>v==null?"–":Math.round(v),0],["Failed contracts","failed_contracts",v=>v??"–",-1]];
  const best = (k, d) => { if (!d) return null; const v = S.map(s => s[k]).filter(x => x != null); return v.length ? (d > 0 ? Math.max(...v) : Math.min(...v)) : null; };
  const macro = Math.max(...S.map(s => s.macro_f1 ?? 0)), lead = S.find(s => s.macro_f1 === macro);
  const AA = S.find(s => s.arm[0] === "A"), sel = B["selective_acc@90"];
  const heroNum = (AA && sel != null && AA.latency_p50_ms && B.latency_p50_ms) ? `<div class="hero-num"><div class="lab" style="color:#111">The number${D.sample ? " · SAMPLE, NOT MEASURED" : ""}</div>
    <div class="hn">Stego decided <b>90%</b> of clauses alone at <b>${pct(sel)}</b> accuracy, <b>${(AA.latency_p50_ms / B.latency_p50_ms).toFixed(1)}×</b> faster than the ${esc(AA.arm.replace(/^A /, ""))}.</div>
    <div class="lab" style="color:#111;text-transform:none;font-weight:500;font-size:12px">"90% of clauses" = the 90% where Drex is most confident (selective accuracy @90). Speed = LLM p50 ÷ Stego p50 per contract. LLM: ${esc(D.llm_model || "unset")}. <b>The accuracy figure is Stego's own, on its most-confident decisions only. It is NOT comparable to the LLM's overall accuracy</b>; for that, read the table and the sensitivity check below.</div></div>` : "";
  $("#view").innerHTML = `${heroNum}
  <div class="card studs" style="padding:28px">${studs(5)}<div style="display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;align-items:center">
    <div style="flex:1;min-width:300px"><span class="badge">Suite: CUAD test · ${S[0]?.contracts ?? "—"} report contracts</span>
      <h1 style="margin:12px 0">Stego benchmark evaluation</h1>
      <p style="color:var(--mut);font-weight:500;margin:0">Three arms, same chunks, same definitions. Thresholds frozen on 20 calibration contracts. Failed runs count as wrong. All arms reported, whichever wins.</p></div>
    <div class="sticker" style="font-size:22px;max-width:340px;text-transform:none">0 LLM calls · arm B</div></div>
    <div class="grid g4" style="margin-top:24px;border-top:2px solid var(--ink);padding-top:16px">
      <div><div class="lab">Macro-F1 (arm B)</div><div class="metric">${B.macro_f1 != null ? B.macro_f1.toFixed(3) : "—"}</div><div class="lab">${(() => { const M = S.find(x => /^M/.test(x.arm)); return M ? "majority-class baseline: " + M.macro_f1.toFixed(3) : ""; })()}</div></div>
      <div><div class="lab">Accuracy @ conf ≥ 0.93 (arm B)</div><div class="metric" style="color:var(--green-d)">${pct(claim)}</div><div class="lab">${(() => { const n = B["n_conf>=0.93"], t = B.decisions_scored; return n && t ? n + " of " + t + " decisions (" + pct(n / t) + ")" : ""; })()}</div></div>
      <div><div class="lab">p50 latency (arm B)</div><div class="metric">${sec(B.latency_p50_ms)}</div></div>
      <div><div class="lab">Cost / contract (arm B)</div><div class="metric" style="color:var(--amber-d)">${usd(B.cost_per_contract_usd)}</div></div></div></div>
  <div class="sec"><h2>Execution arm comparison</h2><span class="badge">green = best in row</span></div>
  ${!AA || (!S.some(x => /^C/.test(x.arm)) && !(D.not_finished || []).some(n => n.arm === "C")) ? `<div class="banner sample" style="margin-bottom:14px">Not run in this run: ${!AA ? "<b>arm A</b> (LLM baseline)" : ""}${!AA && (!S.some(x => /^C/.test(x.arm)) && !(D.not_finished || []).some(n => n.arm === "C")) ? " and " : ""}${(!S.some(x => /^C/.test(x.arm)) && !(D.not_finished || []).some(n => n.arm === "C")) ? "<b>arm C</b> (Drex-first cascade)" : ""}. They need an LLM key with enough quota. Arm B alone is measured.</div>` : ""}
  ${(D.not_finished || []).map(n => `<div class="banner sample" style="margin-bottom:14px"><b>${esc(n.label)} did not finish in time</b> (pre-declared cutoff ${esc(n.cutoff)}). No accuracy is shown for it, and no partial subset is reported as its result.</div>`).join("")}
  <div class="tw"><table><thead><tr><th>Metric</th>${S.map(s => `<th>${esc(s.arm)}</th>`).join("")}</tr></thead><tbody>
    ${rows.map(([n,k,f,d]) => { const bv = best(k, d); return `<tr><td class="l head" style="font-size:14px">${n}</td>${S.map(s => `<td class="${bv != null && s[k] === bv ? "best" : ""}">${s[k] == null ? (k === "brier" || k === "ece" ? "— no probs" : "—") : f(s[k])}</td>`).join("")}</tr>`; }).join("")}
  </tbody></table></div>
  ${S.filter(x => x.failed_contracts > 0).map(x => `<div class="banner sample" style="margin-top:14px"><b>${esc(x.arm.split(" ")[0])}: ${x.failed_contracts} contract${x.failed_contracts === 1 ? "" : "s"} failed</b> (read timeouts, not wrong answers). Under the pre-registered rule they count as wrong on every category. The rule was not changed after seeing results.</div>`).join("")}
  ${D.sensitivity ? `<div class="card" style="margin-top:14px;box-shadow:none"><span class="badge a">sensitivity check · not the pre-registered result</span><div style="margin-top:8px;font-weight:500">Scoring only the <b>${D.sensitivity.contracts}</b> contracts where arm A completed: macro-F1 <b>A ${D.sensitivity.A.macro_f1.toFixed(3)}</b> vs <b>B ${D.sensitivity.B.macro_f1.toFixed(3)}</b> · micro-F1 A ${D.sensitivity.A.micro_f1.toFixed(3)} vs B ${D.sensitivity.B.micro_f1.toFixed(3)} · accuracy A ${pct(D.sensitivity.A.accuracy)} vs B ${pct(D.sensitivity.B.accuracy)}. The accuracy lead in the table above comes mostly from the timed-out contracts.</div>${D.sensitivity_C ? `<div style="margin-top:8px;font-weight:500">Same check for the cascade: on the <b>${D.sensitivity_C.contracts}</b> contracts where arm C completed, macro-F1 <b>C ${D.sensitivity_C.C.macro_f1.toFixed(3)}</b> vs <b>B ${D.sensitivity_C.B.macro_f1.toFixed(3)}</b> · accuracy C ${pct(D.sensitivity_C.C.accuracy)} vs B ${pct(D.sensitivity_C.B.accuracy)}.</div>` : ""}</div>` : ""}
  <div class="grid g2" style="margin-top:32px">
    <div class="card studs">${studs(3)}<span class="badge g">Calibration audit</span><h3 style="margin:8px 0 2px">Reliability: predicted vs actual</h3><div class="lab">ECE ${B.ece?.toFixed(3) ?? "–"} · Brier ${B.brier?.toFixed(3) ?? "–"}</div>${reliability(B.reliability)}</div>
    <div class="card studs">${studs(3)}<span class="badge a">Tradeoff</span><h3 style="margin:8px 0 12px">Selective-accuracy frontier: coverage vs accuracy (arm B)</h3>${frontier(B)}${selective(B)}
      <div class="card" style="background:var(--canvas);margin:18px 0 0;padding:10px 14px;box-shadow:none"><b>Published target, tested:</b> at ≥ 93% confidence, right 97% of the time (a figure from the hackathon brief, not independently verified).  Ours: <b>${pct(claim)}</b> over ${B["n_conf>=0.93"] ?? "?"} decisions. ${B["n_conf>=0.93"] && B.decisions_scored ? `Coverage: ${B["n_conf>=0.93"]} of ${B.decisions_scored} decisions (${pct(B["n_conf>=0.93"] / B.decisions_scored)}) reach that confidence; the rest go to a human. ` : ""}${claim == null ? "" : claim >= .97 ? "Target held on this task." : `${((.97 - claim) * 100).toFixed(1)} points below the target on this task.`}</div></div></div>
  <div class="sec"><h2>Per-category F1 (Drex only)</h2></div><div class="card">${(() => { const w = Object.entries(B.per_category_f1 || {}).sort((a, b) => a[1] - b[1]).slice(0, 4);
      return w.length ? `<div class="banner sample" style="margin-bottom:14px"><b>Weakest four:</b> ${w.map(([c, v]) => esc(c) + " " + v.toFixed(2)).join(" · ")}</div>` : ""; })()}${catF1(B.per_category_f1)}</div>
  <div class="sec"><h2>Rigor rules</h2><span class="badge y">pre-registered</span></div>
  <div class="cols3">${["Thresholds (θ presence, τ abstention) set on 20 calibration contracts only, then committed to git.","All three arms are reported, whichever wins.","Failed runs count as wrong on every category.","Same chunks, definitions, concurrency and retry policy for every arm. Final timed run uses --no-cache.","The exact LLM model ID goes on the results slide: " + (D.llm_model || "unset") + ".","Every call is logged to ledger.jsonl. Those are the receipts."].map((t, i) => `<div class="card studs">${studs(2)}<span class="badge">${i + 1}</span><p style="margin:8px 0 0;font-weight:500">${t}</p></div>`).join("")}</div>
  <div class="sec"><h2>Raw verification receipts</h2><span class="badge g">from ledger.jsonl</span></div>${receipts()}`;
}
function reliability(rel) {
  if (!rel?.length) return `<div class="lab" style="padding:20px 0">No reliability data.</div>`;
  const W = 320, H = 270, m = 36, x = v => m + v * (W - m - 12), y = v => H - m - v * (H - m - 12);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Reliability curve" style="background:var(--canvas);border:2px solid var(--ink);margin-top:10px">
    <line x1="${x(0)}" y1="${y(0)}" x2="${x(1)}" y2="${y(1)}" stroke="#111" stroke-dasharray="5 4"/>
    ${[0,.5,1].map(t => `<text x="${x(t)}" y="${H - 18}" text-anchor="middle">${t}</text><text x="${m - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join("")}
    <polyline fill="none" stroke="#006e2b" stroke-width="3" points="${rel.map(r => `${x(r.mean_p)},${y(r.frac_yes)}`).join(" ")}"/>
    ${rel.map(r => `<circle cx="${x(r.mean_p)}" cy="${y(r.frac_yes)}" r="${3 + Math.min(5, Math.log10(r.n + 1) * 1.6)}" fill="#2FA84F" stroke="#111" stroke-width="2"><title>${r.bin}: n=${r.n}, observed ${(r.frac_yes * 100).toFixed(0)}%</title></circle>`).join("")}
    <text x="${W / 2}" y="${H - 4}" text-anchor="middle">predicted p(yes) · dot size = n · dashed = perfect</text></svg>`;
}
function frontier(B) {
  const pts = [[.8, B["selective_acc@80"]], [.9, B["selective_acc@90"]], [1, B["selective_acc@100"]]].filter(p => p[1] != null);
  if (!pts.length) return "";
  const W = 320, H = 150, m = 34, lo = Math.min(...pts.map(p => p[1])) - .03, hi = Math.min(1, Math.max(...pts.map(p => p[1])) + .02);
  const x = v => m + (v - .75) / .27 * (W - m - 12), y = v => H - 24 - (v - lo) / (hi - lo || 1) * (H - 44);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Coverage vs accuracy" style="background:var(--canvas);border:2px solid var(--ink);margin-bottom:10px">
    <polyline fill="none" stroke="#835400" stroke-width="3" points="${pts.map(p => `${x(p[0])},${y(p[1])}`).join(" ")}"/>
    ${pts.map(p => `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="5" fill="#F5A524" stroke="#111" stroke-width="2"/><text x="${x(p[0])}" y="${y(p[1]) - 9}" text-anchor="middle">${(p[1] * 100).toFixed(1)}%</text><text x="${x(p[0])}" y="${H - 8}" text-anchor="middle">${p[0] * 100}%</text>`).join("")}
    <text x="6" y="12">accuracy</text></svg>`;
}
function selective(B) {
  return [["80", B["selective_acc@80"]], ["90", B["selective_acc@90"]], ["100", B["selective_acc@100"]]].map(([c, v]) =>
    `<div style="display:flex;align-items:center;gap:12px;margin:10px 0"><span class="mono" style="width:110px;font-size:12px">${c}% coverage</span>
     <div class="meter" style="flex:1;margin:0;height:16px"><i style="width:${(v || 0) * 100}%"></i></div><b class="mono" style="width:60px;text-align:right">${pct(v)}</b></div>`).join("");
}
function catF1(m) {
  if (!m) return `<div class="lab">No data.</div>`;
  return Object.entries(m).sort((a, b) => b[1] - a[1]).map(([c, v]) =>
    `<div style="display:flex;align-items:center;gap:12px;margin:6px 0"><span style="width:230px;font-weight:500">${esc(c)}</span>
     <div class="meter" style="flex:1;margin:0"><i style="width:${v * 100}%"></i></div><b class="mono" style="width:44px;text-align:right">${v.toFixed(2)}</b></div>`).join("");
}
function receipts() {
  const L = (D.ledger || []).slice(-12).reverse();
  return `<div class="tw"><table><thead><tr><th>Time</th><th>Arm</th><th>Contract · unit</th><th>Model</th><th>Latency</th><th>In tok</th><th>Status</th></tr></thead><tbody>
  ${L.map(r => `<tr><td class="l">${new Date(r.ts * 1000).toLocaleTimeString()}</td><td>${esc(r.arm)}</td><td class="l">${esc((r.contract || "").slice(0, 30))} ${esc(r.unit || "")}</td>
    <td><span class="badge ${kind(r) === "drex" ? "g" : "a"}">${esc(r.model || "")}</span></td><td>${r.latency_ms != null ? Math.round(r.latency_ms) + " ms" : "–"}</td><td>${r.input_tokens ?? "–"}</td><td>${esc(r.status || "ok")}</td></tr>`).join("") || '<tr><td colspan="7">No ledger yet.</td></tr>'}
  </tbody></table><div class="lab" style="padding:10px 12px;background:var(--grey);border-top:2px solid var(--ink)">Showing ${L.length} of ${(D.ledger || []).length} logged calls</div></div>`;
}

async function startReplay(speed) {
  (window._raceT || []).forEach(clearInterval); window._raceT = [];
  fetch("/api/race/cancel", { method: "POST" }).catch(() => {});   // never leave a live race running behind a replay
  let rp; try { const r = await fetch("replay/race_replay.json"); if (!r.ok) throw new Error(r.status); rp = await r.json(); } catch (e) { toast("No recorded race found (ui/replay/race_replay.json)."); return; }
  const t0 = Date.now();
  const iv = setInterval(() => {
    const el = (Date.now() - t0) * speed;       // recorded milliseconds elapsed
    const R = { recorded: true, title: rp.title, speed, pages: rp.pages, drex_model: rp.drex_model, llm_model: rp.llm_model, mock: false, phase: "racing", finished: false,
      stego: el >= rp.stego_ms ? { status: "done", ms: rp.stego_ms, clauses: rp.clauses } : { status: "running" },
      llm: el >= rp.llm_ms ? { status: "done", ms: rp.llm_ms, calls: 1, present: rp.present } : { status: "running" } };
    drawRace(R, el); if (R.stego.status === "done" && R.llm.status === "done") clearInterval(iv);
  }, 100);
  window._raceT.push(iv);
}
async function startRace(file) {
  (window._raceT || []).forEach(clearInterval); window._raceT = []; window._animated = {};
  drawRace(null, 0, "The dinos are lining up at the start…");
  let j; try { const r = await fetch("/api/race", { method: "POST", headers: { "X-Filename": encodeURIComponent(file.name) }, body: file }); j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); }
  catch (e) { toast("Race failed: " + e.message); return; }
  let t0 = null;   // the clock starts when the server leaves its cool-down
  const iv = setInterval(async () => { try { const R = await (await fetch("/api/race/" + j.id)).json(); if (R.phase === "racing" && t0 === null) t0 = Date.now();
    drawRace(R, t0 === null ? 0 : Date.now() - t0); if (R.finished) { clearInterval(iv); drawRace(R, t0 === null ? 0 : Date.now() - t0); } } catch (e) { /* keep polling */ } }, 200);
  window._raceT.push(iv);

function clip(t, n = 240) {
  if (!t) return ""; if (t.length <= n) return t;
  const cut = t.slice(0, n), i = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("; "));
  if (i > n * .5) return cut.slice(0, i + 1);
  const sp = cut.lastIndexOf(" "); return cut.slice(0, sp > 0 ? sp : n) + "…";
}
const NOEV = '<i class="noev">No supporting passage found</i>';
const PDFJS = "/ui/vendor/pdfjs/pdf.min.js", PDFW = "/ui/vendor/pdfjs/pdf.worker.min.js";   // bundled copy (Apache-2.0, see ui/vendor/pdfjs/LICENSE)
const PDFJS_CDN = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js", PDFW_CDN = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
function loadPdfjs() {
  return window._pdfjsP || (window._pdfjsP = new Promise((res, rej) => {
    if (window.pdfjsLib) return res(window.pdfjsLib);
    const tryLoad = (src, worker, next) => { const el = document.createElement("script"); el.src = src;
      el.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = worker; res(window.pdfjsLib); };
      el.onerror = () => next ? next() : rej(new Error("pdf.js could not load")); document.head.append(el); };
    tryLoad(PDFJS, PDFW, () => tryLoad(PDFJS_CDN, PDFW_CDN));   // local copy first, CDN only if the local file is missing
  }));
}
const normT = t => String(t).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
async function renderPdf() {
  const w = $("#pdfwrap"); if (!w) return;
  // if PDF.js cannot load (offline, CDN blocked) fall back to the browser's own viewer after 10 s, instead of hanging on "Loading page…"
  const fallback = why => { if (!document.body.contains(w) || w.querySelector("canvas")) return;
    w.innerHTML = `<div class="lab" style="padding:8px 12px;background:var(--yellow)">Highlight unavailable (${esc(why)}). Showing the browser's own PDF viewer on page ${w.dataset.page}; the evidence passage is shown below.</div><iframe title="Contract PDF" style="width:100%;height:560px;border:0" src="${w.dataset.pdf}#page=${w.dataset.page}"></iframe>`; };
  const timer = setTimeout(() => fallback("PDF.js did not load within 10 s"), 10000);
  try {
    const lib = await loadPdfjs(), doc = await lib.getDocument(w.dataset.pdf).promise, pg = await doc.getPage(+w.dataset.page);
    const width = w.clientWidth || 600, v0 = pg.getViewport({ scale: 1 }), scale = width / v0.width * 2, vp = pg.getViewport({ scale });
    const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height;
    await pg.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
    clearTimeout(timer); w.innerHTML = ""; w.append(cv);
    const q = normT(w.dataset.q || ""); if (!q) return;
    const tc = await pg.getTextContent(); let full = "", map = [];
    tc.items.forEach((it, i) => { const n = normT(it.str); if (!n) return; if (full) full += " "; map.push([full.length, full.length + n.length, i]); full += n; });
    const at = full.indexOf(q.slice(0, 60)); if (at < 0) return;
    const end = Math.min(full.length, at + q.length);
    for (const [a, b, i] of map) { if (b <= at || a >= end) continue;
      const it = tc.items[i], tx = lib.Util.transform(vp.transform, it.transform), h = Math.hypot(tx[2], tx[3]);
      const d = document.createElement("div"); d.className = "hlbox";
      d.style.cssText = `left:${(tx[4] / vp.width * 100).toFixed(2)}%;top:${((tx[5] - h * .95) / vp.height * 100).toFixed(2)}%;width:${(it.width * scale / vp.width * 100).toFixed(2)}%;height:${(h * 1.2 / vp.height * 100).toFixed(2)}%`;
      w.append(d); }
  } catch (e) { clearTimeout(timer); fallback(e.message); }
}

      else { const yes = !!S.present[c]; cls += " on " + (yes ? "yes" : "no"); sub = yes ? "present" : "absent"; }
      if (dis.has(c)) cls += " dis";

  }).join("");

    const thinking = k === "llm" && running ? `<div class="lab" style="color:#111;text-transform:none;font-size:13px;margin:-2px 0 6px">still thinking… ${Math.round(t / 1000)} s so far</div>` : "";
    return `<div class="race-p ${k}"><div class="rp-h"><b>${title}</b><span class="badge ${S.status === "error" ? "r" : running ? "y" : "g"}">${S.status === "error" ? "ERROR" : running ? "RUNNING" : "DONE"}</span></div>
      <div class="lab">${sub}</div><div class="rp-t">${(t / 1000).toFixed(1)}<small>s</small></div>${thinking}
      <div class="rp-kv">${k === "stego" ? `<span>Drex decisions</span><b>${S.decisions ?? "–"}</b><span>Reasoning-LLM calls</span><b>0</b>` : `<span>LLM calls</span><b>${S.calls ?? (running ? "…" : 0)}</b><span>Pages sent</span><b>${R.pages}</b>`}</div>
      ${S.status === "error" ? `<div class="banner sample" style="margin:0">${esc(S.error)}</div>` : `<div class="plates">${plates(k, S)}</div>`}</div>`; };

    verdict = `<div class="verdict"><b>Stego finished in ${sSec} s.</b> The LLM is still thinking (${Math.round(el / 1000)} s so far). Its answers will appear here if and when they arrive; you don't have to wait.</div>`;
  } else if (stegoDone && R.llm.status === "error") {
    verdict = `<div class="verdict"><b>Stego finished in ${sSec} s.</b> The LLM did not finish: ${esc(R.llm.error || "error")}</div>`;
  }
  if (both) {
    const s = R.stego.ms, l = R.llm.ms, first = s <= l ? "Stego" : "The LLM", logo = (document.querySelector(".logomark")?.outerHTML || "");
    verdict = `<div class="agree">Agree on ${cats.length - dis.size} of ${cats.length} · disagree on ${dis.size}<span class="lab" style="text-transform:none;font-weight:500">outlined tiles = the two sides disagree. Dashed = Drex below τ.${R.mock ? " (mock answers, meaningless)" : ""}</span></div>
      <div class="verdict" style="display:flex;gap:16px;align-items:center"><span style="width:70px;flex:none">${logo}</span><div>${first} finished first: Stego ${(s / 1000).toFixed(1)} s vs LLM ${(l / 1000).toFixed(1)} s${s < l ? ` (${(l / s).toFixed(1)}× faster)` : ""}.${R.mock ? ' <span class="badge r">MOCK TIMINGS, NOT REAL</span>' : ""}
      <div class="lab" style="margin-top:6px;color:#111;text-transform:none;font-weight:500">${R.recorded ? "A recorded benchmark run on one contract: Drex-only arm B and the LLM arm A, each timed on its own. Speed only: agreement is not accuracy. The benchmark page compares accuracy over all report contracts." : "One contract, one run, started cold: the LLM prompt carries a unique run id so provider-side caching can't speed it up, and any earlier race was cancelled. Speed only: agreement is not accuracy. The benchmark page compares accuracy over the report contracts."}</div></div></div>`;
  }
  const rec = R.recorded ? `<div class="banner sample" style="margin-bottom:16px"><b>RECORDED</b>: a real run from the benchmark (${esc(R.title)}, ${R.pages} chunks), replayed at ${R.speed === 1 ? "real time" : R.speed + "× speed"}. The times shown are the recorded wall-clock times, not this browser's. Not a live race.</div>` : "";
  box.innerHTML = `${rec}<div class="race">${panel("stego", "STEGO · Drex only", "Drex " + esc(R.drex_model || ""))}${panel("llm", "LLM BASELINE", esc(R.llm_model || "unset") + (R.mock ? " (mock)" : ""))}</div>${verdict}`;
}

    return { c, k, p: x.p, page: e.page ?? null, chunk: e.chunk, text: e.text || "" }; });
  items.sort((a, b) => (a.page ?? 999) - (b.page ?? 999) || b.p - a.p);

      ${kv("Thresholds", `θ=${D.theta} · τ=${(+D.tau).toFixed(2)}`)}${kv("Reasoning LLM", "0 calls")}${kv("Clauses checked", D.categories.length)}${kv("Time", sec(ct.ms))}</div>
    ${warn ? `<div class="pd-warn">${esc(warn)}</div>` : ""}
    <div class="pd-sum"><div class="r"><b>${q.r.length}</b><span>Urgent (policy)</span></div><div class="a"><b>${q.a.length}</b><span>Found · confirm</span></div><div class="g"><b>${q.g.length}</b><span>Auto-cleared</span></div><div class="u"><b>${q.u.length}</b><span>Human review</span></div></div>
    <div class="pd-read">${pagesList.length ? "Pages to read: " + pagesList.map(p => "p." + p).join(", ") : "No flagged page mapping available."}${ct.pages ? " (of " + ct.pages + ")" : ""}</div>
    <div class="pd-h">1 · Findings by page</div>

      ${items.map(i => `<tr><td class="m">${pg(i)}</td><td><b>${esc(i.c)}</b></td><td><span class="pd-q ${i.k}">${QN[i.k]}</span></td><td class="m">${i.p.toFixed(2)}</td></tr>`).join("") || '<tr><td colspan="4">No flagged clauses.</td></tr>'}</tbody></table>

function printBrief() {

async function sealBrief(ct) {
  const reviews = {}; D.categories.forEach(c => { const d = state.decisions[ct.title + "|" + c]; if (d) reviews[c] = d === "ok" ? "approved" : "escalated"; });
  try { SEALS[ct.id] = await postJSON("/api/seal", { id: ct.id, reviews }); toast("Sealed: " + (SEALS[ct.id].verify.valid ? "valid" : "check status")); }
  catch (e) { toast("Seal failed: " + e.message); }
  if (state.tab === "brief") { brief(); const f = $("#fossil"); if (f) f.scrollIntoView({ behavior: "smooth", block: "start" }); }
}

  <div id="fossil" class="noprint" style="margin:20px 0 28px"></div>

    <span class="badge g">Brief</span> <span class="lab">${D.sample ? "sample data" : "run " + esc(D.run)}</span>${S ? ` <span class="badge ${S.verify.valid ? "g" : "r"}">Sealed ✓</span>` : ""}
    <h1 style="margin:10px 0 2px;text-transform:uppercase;font-size:42px">Contract review brief</h1><div style="font:500 18px var(--head);color:var(--mut)">${esc(ct.title)}</div>

    <div class="band r"><span>Urgent · send to counsel</span><span class="badge">${q.r.length} items</span></div><div class="bsec">${q.r.map(c => card(c, "r")).join("") || '<div class="lab" style="padding:8px">None</div>'}</div>
    <div class="band a"><span>Found · confirm</span><span class="badge">${q.a.length} items</span></div><div class="bsec">${q.a.map(c => card(c, "a")).join("") || '<div class="lab" style="padding:8px">None</div>'}</div>
    <div class="card u" style="box-shadow:none;margin-bottom:22px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><h3>Human review (${q.u.length})</h3><span class="badge">Drex is below τ: needs a person</span></div>
      ${q.u.length ? `<div class="tw" style="margin-top:10px;box-shadow:none"><table class="bt"><thead><tr><th>Clause</th><th>Where</th><th>p</th><th>Lean</th><th>Passage</th></tr></thead><tbody>${q.u.map(row).join("")}</tbody></table></div>` : '<div class="lab" style="margin-top:8px">None</div>'}</div>
    <div class="band g"><span>Auto-cleared (confidently absent)</span><span class="badge">${q.g.length} clauses</span></div><div class="bsec"><div class="ag">${q.g.map(c => `<div><span>${esc(c)}</span><span class="mono" style="color:var(--green-d)">cleared</span></div>`).join("") || "None"}</div></div>
    <div class="lab" style="margin-top:20px">Clause triage, not a legal-risk score. "Urgent" is a policy layer with no ground truth. Presence decided by Drex; no general-purpose reasoning LLM.</div></div>
  <div id="printdoc">${printDoc(ct, q)}</div>`;
  fossilPanel(ct);
  $("#tbSeal").onclick = () => sealBrief(ct);
  $("#csel").onchange = e => { state.ci = +e.target.value; brief(); };
  $("#exj").onclick = () => { const b = new Blob([JSON.stringify({ contract: ct.title, theta: D.theta, tau: D.tau, queues: q, clauses: ct.clauses }, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "stego-brief.json"; a.click(); };
  $("#view").onclick = e => { const g = e.target.closest("[data-go]"); if (g) go(g.dataset.go); };
}

try { state.demo = localStorage.getItem("stego_demo") === "1"; } catch (e) { /* storage blocked */ }
$("#demoBtn").onclick = () => { const ok = D && D.server && D.server.mode === "live" && !D.sample;
  if (!ok) { toast("Demo mode needs live Drex (DREX_API_KEY) and real results in runs/. Mock and sample banners stay on."); return; }
  state.demo = !state.demo; try { localStorage.setItem("stego_demo", state.demo ? "1" : "0"); } catch (e) { /* ignore */ } render(); };
addEventListener("pagehide", () => { if (window._raceT && window._raceT.length && navigator.sendBeacon) navigator.sendBeacon("/api/race/cancel"); });
(async () => { D = await load(); state.tab = fromHash(); render(); })();
</script>
</body>
